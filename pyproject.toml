[project]
name = "finance-tracker"
version = "0.1.0"
description = "Personal finance tracker with finTS bank sync"
requires-python = ">=3.11"
dependencies = [
    "fints",
    "sqlalchemy>=2",
    "alembic",
    "fastapi",
    "uvicorn",
    "jinja2",
    "python-dotenv",
    "keyring",
    "apscheduler",
    "pytest",
]

[tool.poetry]
name = "finance-tracker"
version = "0.1.0"
description = "Personal finance tracker with finTS bank sync"
authors = []
readme = "README.md"
packages = [{ include = "app" }]
requires-python = ">=3.11"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fints = "*"
sqlalchemy = ">=2"
alembic = "*"
fastapi = "*"
uvicorn = "*"
jinja2 = "*"
python-dotenv = "*"
keyring = "*"
apscheduler = "*"
pytest = "*"

[tool.poetry.group.dev.dependencies]
pytest = "*"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
