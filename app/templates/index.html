<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Finance Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-slate-100 min-h-screen">
<div class="max-w-7xl mx-auto p-6">
  <header class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold text-slate-800">Finance Tracker</h1>
    <div class="flex items-center gap-3">
      <span id="sync-status" class="text-sm text-slate-500"></span>
      <button id="sync-btn" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50">
        Sync starten
      </button>
    </div>
  </header>

  <!-- KPI-Cards -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
    <div class="bg-white rounded-xl shadow p-4">
      <div class="text-sm text-slate-500">Gesamtsaldo</div>
      <div id="kpi-balance" class="text-2xl font-bold text-slate-800">–</div>
    </div>
    <div class="bg-white rounded-xl shadow p-4">
      <div class="text-sm text-slate-500">Einkommen (Monat)</div>
      <div id="kpi-income" class="text-2xl font-bold text-green-600">–</div>
    </div>
    <div class="bg-white rounded-xl shadow p-4">
      <div class="text-sm text-slate-500">Ausgaben (Monat)</div>
      <div id="kpi-expenses" class="text-2xl font-bold text-red-600">–</div>
    </div>
    <div class="bg-white rounded-xl shadow p-4">
      <div class="text-sm text-slate-500">Netto-Cashflow</div>
      <div id="kpi-net" class="text-2xl font-bold text-slate-800">–</div>
    </div>
  </div>

  <!-- Personen-Übersicht -->
  <div class="bg-white rounded-xl shadow p-4 mb-6">
    <div class="flex justify-between items-center mb-3">
      <h2 class="font-semibold text-slate-700">Personen</h2>
      <div class="flex gap-2">
        <input id="new-person-name" placeholder="Neue Person" class="border rounded px-2 py-1 text-sm">
        <button id="add-person" class="px-3 py-1 bg-blue-600 text-white rounded text-sm">+</button>
      </div>
    </div>
    <div id="persons-cards" class="grid grid-cols-1 md:grid-cols-3 gap-3"></div>
  </div>

  <!-- Charts -->
  <div class="grid md:grid-cols-3 gap-4 mb-6">
    <div class="bg-white rounded-xl shadow p-4 md:col-span-2">
      <div class="flex justify-between items-center mb-2">
        <h2 class="font-semibold text-slate-700">Einnahmen vs. Ausgaben</h2>
        <div class="flex gap-1">
          <button data-gran="monthly" class="gran-btn px-3 py-1 text-sm rounded bg-blue-600 text-white">Monatlich</button>
          <button data-gran="yearly" class="gran-btn px-3 py-1 text-sm rounded bg-slate-200 text-slate-700">Jährlich</button>
        </div>
      </div>
      <canvas id="timeline-chart" height="120"></canvas>
    </div>
    <div class="bg-white rounded-xl shadow p-4">
      <h2 class="font-semibold text-slate-700 mb-2">Kategorien</h2>
      <canvas id="breakdown-chart" height="220"></canvas>
    </div>
  </div>

  <!-- Transaktionstabelle -->
  <div class="bg-white rounded-xl shadow p-4">
    <div class="flex flex-wrap gap-2 mb-4 items-center">
      <input id="f-search" placeholder="Suche Partner/Zweck…" class="border rounded px-3 py-2 text-sm flex-1 min-w-48">
      <select id="f-category" class="border rounded px-2 py-2 text-sm"><option value="">Alle Kategorien</option></select>
      <select id="f-person" class="border rounded px-2 py-2 text-sm"><option value="">Alle Personen</option></select>
      <select id="f-account" class="border rounded px-2 py-2 text-sm"><option value="">Alle Konten</option></select>
      <input id="f-from" type="date" class="border rounded px-2 py-2 text-sm">
      <input id="f-to" type="date" class="border rounded px-2 py-2 text-sm">
      <button id="f-apply" class="px-4 py-2 bg-slate-700 text-white rounded text-sm">Filtern</button>
    </div>
    <table class="w-full text-sm">
      <thead class="text-left text-slate-500 border-b">
        <tr><th class="py-2">Datum</th><th>Partner</th><th>Zweck</th><th class="text-right">Betrag</th><th>Konto</th><th>Kategorie</th></tr>
      </thead>
      <tbody id="tx-body"></tbody>
    </table>
    <div class="flex justify-between items-center mt-3 text-sm text-slate-500">
      <span id="tx-count"></span>
      <div class="flex gap-2">
        <button id="prev-page" class="px-3 py-1 border rounded">‹</button>
        <button id="next-page" class="px-3 py-1 border rounded">›</button>
      </div>
    </div>
  </div>

  <!-- Kategorien & Regeln Verwaltung -->
  <div class="grid md:grid-cols-2 gap-4 mt-6">
    <div class="bg-white rounded-xl shadow p-4">
      <h2 class="font-semibold text-slate-700 mb-2">Kategorien</h2>
      <ul id="cat-list" class="text-sm divide-y"></ul>
      <div class="flex gap-2 mt-3">
        <input id="new-cat-name" placeholder="Neue Kategorie" class="border rounded px-2 py-1 text-sm flex-1">
        <select id="new-cat-type" class="border rounded text-sm"><option value="expense">Ausgabe</option><option value="income">Einnahme</option></select>
        <button id="add-cat" class="px-3 py-1 bg-blue-600 text-white rounded text-sm">+</button>
      </div>
    </div>
    <div class="bg-white rounded-xl shadow p-4">
      <h2 class="font-semibold text-slate-700 mb-2">Regeln</h2>
      <ul id="rule-list" class="text-sm divide-y"></ul>
      <div class="flex gap-2 mt-3">
        <input id="new-rule-pattern" placeholder="Pattern" class="border rounded px-2 py-1 text-sm flex-1">
        <select id="new-rule-cat" class="border rounded text-sm"></select>
        <button id="add-rule" class="px-3 py-1 bg-blue-600 text-white rounded text-sm">+</button>
      </div>
    </div>
    <div class="bg-white rounded-xl shadow p-4 md:col-span-2 lg:col-span-1">
      <h2 class="font-semibold text-slate-700 mb-2">Konten → Personen</h2>
      <ul id="account-owner-list" class="text-sm divide-y"></ul>
    </div>
  </div>
</div>

<div id="error-banner" class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 bg-red-600 text-white px-4 py-2 rounded-lg shadow"></div>
<script src="/static/main.js?v={{ js_version }}"></script>
</body>
</html>
